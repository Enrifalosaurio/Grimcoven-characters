[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grimcoven-equipos"
version = "0.1.0"
description = "Generador de equipos para Grimcoven a partir de un catálogo de cazadores y Griefbound."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1.6",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "docker: tests que construyen la imagen Docker y arrancan contenedores (se saltan sin Docker)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".factory"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
